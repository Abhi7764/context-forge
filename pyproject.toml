[project]
name = "context-forge"
version = "1.0.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # Text splitting
    "langchain-text-splitters>=0.3.0",

    # Embeddings
    "sentence-transformers>=4.0.0",

    # Vector databases
    "pinecone>=6.0.0",
    "chromadb>=1.0.0",

    # LLM providers
    "openai>=1.80.0",
    "anthropic>=0.50.0",
    "google-genai>=1.15.0",
    # HTTP client (connection pooling for LLM clients)
    "httpx[http2]>=0.28.0",
    "requests>=2.31.0",

    # Hybrid search (BM25 keyword matching)
    "rank-bm25>=0.2.2",

    # Document parsing
    "pypdf>=5.0.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
